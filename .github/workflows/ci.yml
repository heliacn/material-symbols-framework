name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs of the same workflow on the same ref
# (e.g. when pushing to a PR branch) to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generated icon source is gitignored, so we must regenerate
      # before building. ms/ ships in the repo, so this is offline.
      - name: Generate per-framework sources
        run: |
          for fw in react preact vue solid svelte astro react-native vanilla \
                    react-svg preact-svg vue-svg solid-svg svelte-svg astro-svg \
                    vanilla-svg angular-svg; do
            echo "::group::generate $fw"
            node scripts/generate.mjs "$fw"
            echo "::endgroup::"
          done

      - name: Build all packages
        run: pnpm -r --filter "./packages/*" run build

      - name: Smoke test
        run: node scripts/smoke-test.mjs
